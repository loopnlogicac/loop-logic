<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson · Loop &amp; Logic</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/lesson.css">
</head>
<body class="reader">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true">∿</span><div><strong>Loop &amp; Logic</strong><small id="tagline">Learn with purpose</small></div></div>
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <div class="top-actions"><button id="lang" class="chip" type="button" aria-label="Switch language">EN · বাংলা</button></div>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Reading options">
    <select id="lesson-pick" aria-label="Lesson"></select>
    <div class="seg" role="group" aria-label="Reading level" id="level-seg">
      <button type="button" data-level="1" id="lv1">Simpler</button>
      <button type="button" data-level="2" id="lv2">Standard</button>
      <button type="button" data-level="3" id="lv3">Deeper</button>
    </div>
    <label class="switch"><input type="checkbox" id="original"> <span id="original-label">Show original</span></label>
    <div class="spacer"></div>
    <button type="button" class="chip" id="display-btn" aria-expanded="false" aria-controls="display-menu">Aa</button>
    <button type="button" class="chip" id="why-btn" aria-expanded="false" aria-controls="why-panel">Why is this tailored?</button>
  </div>
  <div id="display-menu" class="popover" hidden>
    <p class="pop-title" id="display-title">Page style</p>
    <div class="preset-row">
      <button type="button" data-preset="light" class="preset p-light" id="pr-light">Light</button>
      <button type="button" data-preset="sepia" class="preset p-sepia" id="pr-sepia">Sepia</button>
      <button type="button" data-preset="dark" class="preset p-dark" id="pr-dark">Dark</button>
      <button type="button" data-preset="contrast" class="preset p-contrast" id="pr-contrast">High contrast</button>
    </div>
    <label class="switch"><input type="checkbox" id="large"> <span id="large-label">Larger text</span></label>
    <label class="switch"><input type="checkbox" id="enabled"> <span id="enabled-label">Adapt this page to me</span></label>
  </div>
  <aside id="why-panel" class="popover why" hidden aria-live="polite">
    <p class="pop-title" id="why-title">Why this page looks like this</p>
    <ul id="why-list"></ul>
    <p class="muted small" id="why-foot"></p>
  </aside>

  <div id="suggestion" class="suggestion" hidden role="status"></div>

  <div class="reader-layout" id="layout">
    <main class="article" id="article" aria-live="polite">
      <p class="muted">Loading…</p>
    </main>
    <aside class="sidebar" id="sidebar" aria-label="Help" hidden>
      <div class="side-head">
        <strong id="side-title">Help</strong>
        <button type="button" class="icon" id="side-close" aria-label="Close help">×</button>
      </div>
      <blockquote id="side-quote" class="quote"></blockquote>
      <div class="side-actions" role="group" aria-label="Help options">
        <button type="button" data-action="understand" id="act-understand">Quick understand</button>
        <button type="button" data-action="search" id="act-search">Search trusted sources</button>
        <button type="button" data-action="quiz" id="act-quiz">Quiz me</button>
      </div>
      <div id="side-body" class="side-body"></div>
    </aside>
  </div>

  <div id="sel-pop" class="sel-pop" hidden role="toolbar" aria-label="Help with selected text">
    <button type="button" data-action="understand" id="sp-understand">Explain</button>
    <button type="button" data-action="search" id="sp-search">Sources</button>
    <button type="button" data-action="quiz" id="sp-quiz">Quiz</button>
  </div>

  <footer class="foot" id="foot">Answers come only from the reviewed library and approved websites.</footer>
  <script type="module" src="/lesson.js"></script>
  <script type="module" src="/ask.js"></script>
</body>
</html>
