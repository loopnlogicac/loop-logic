# Render Blueprint: one free web service. Secrets (API keys) are marked
# sync: false, so Render asks for them in its dashboard; they never go in Git.
services:
  - type: web
    name: loop-logic
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_MODE
        value: anonymous
      - key: FREE_DAILY_AI_CALLS
        value: "10"
      - key: MIN_GROUP_SIZE
        value: "3"
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
